services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    # Este comando descarga el modelo automáticamente al arrancar
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 10 && ollama pull llama3 && wait" ]