<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Chat AI - Retro Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive, monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #0a0e27;
            border: 4px solid #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1);
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #00ff00, #00aa00);
            color: #000;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            border-bottom: 3px solid #00ff00;
            text-shadow: none;
            letter-spacing: 2px;
        }

        .header h1 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .status {
            font-size: 8px;
            opacity: 0.8;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(ellipse at 50% 0%, rgba(0, 255, 0, 0.05), transparent);
        }

        .message {
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            font-size: 10px;
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
            position: relative;
        }

        .message.user .message-content {
            background: rgba(0, 100, 255, 0.15);
            border-color: #00aaff;
            color: #00aaff;
            text-shadow: 0 0 5px rgba(0, 170, 255, 0.5);
            text-align: right;
        }

        .message.ai .message-content {
            background: rgba(0, 255, 0, 0.1);
            border-color: #00ff00;
            color: #00ff00;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .message-label {
            font-size: 8px;
            margin-bottom: 3px;
            opacity: 0.7;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .message.user .message-label {
            text-align: right;
            color: #00aaff;
        }

        .message.ai .message-label {
            color: #00ff00;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #00ff00;
            border: 1px solid #00ff00;
            display: inline-block;
            animation: blink 0.6s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        .input-container {
            padding: 15px;
            background: #0a0e27;
            border-top: 3px solid #00ff00;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid #00ff00;
            padding: 5px 10px;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Press Start 2P', cursive, monospace;
            font-size: 10px;
            outline: none;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        input[type="text"]::placeholder {
            color: rgba(0, 255, 0, 0.4);
        }

        input[type="text"]::selection {
            background: #00ff00;
            color: #000;
        }

        .send-btn {
            padding: 8px 15px;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border: 2px solid #00ff00;
            color: #000;
            font-family: 'Press Start 2P', cursive, monospace;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .send-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #00ffaa, #00ff00);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-btn {
            padding: 8px 10px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff4444;
            color: #ff4444;
            font-family: 'Press Start 2P', cursive, monospace;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }

        .clear-btn:hover {
            background: rgba(255, 0, 0, 0.4);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
        }

        .error-message {
            color: #ff4444;
            background: rgba(255, 0, 0, 0.1);
            border-color: #ff4444;
        }

        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar {
            width: 10px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(0, 255, 0, 0.05);
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 5px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        /* Cursor blink animation */
        @keyframes blink-cursor {
            0%, 49% {
                border-right-color: #00ff00;
            }
            50%, 100% {
                border-right-color: transparent;
            }
        }

        .input-wrapper {
            border-right: 2px solid #00ff00;
            animation: blink-cursor 1s infinite;
        }

        @media (max-width: 600px) {
            body {
                font-size: 12px;
            }

            .header h1 {
                font-size: 12px;
            }

            .message-content {
                max-width: 90%;
                font-size: 8px;
            }

            input[type="text"] {
                font-size: 8px;
            }

            .send-btn,
            .clear-btn {
                font-size: 8px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 CHAT AI TERMINAL v1.0</h1>
            <div class="status">[ OLLAMA ONLINE ] [ READY TO CHAT ]</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                <div>
                    <div class="message-label">[ AI SYSTEM ]</div>
                    <div class="message-content">
                        WELCOME TO CHAT AI<br>
                        TYPE YOUR MESSAGE AND PRESS SEND<br>
                        POWERED BY OLLAMA & SPRING BOOT
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="YOUR MESSAGE HERE..."
                    autocomplete="off"
                >
            </div>
            <button class="send-btn" id="sendBtn">SEND</button>
            <button class="clear-btn" id="clearBtn">CLEAR</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        let isWaitingForResponse = false;

        // Send message on button click
        sendBtn.addEventListener('click', sendMessage);

        // Send message on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isWaitingForResponse) {
                sendMessage();
            }
        });

        // Clear chat history
        clearBtn.addEventListener('click', () => {
            if (confirm('CLEAR ALL MESSAGES? [Y/N]')) {
                chatContainer.innerHTML = '';
                messageInput.value = '';
                messageInput.focus();
            }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isWaitingForResponse) return;

            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            isWaitingForResponse = true;
            sendBtn.disabled = true;

            // Add typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.innerHTML = `
                <div>
                    <div class="message-label">[ AI SYSTEM ]</div>
                    <div class="message-content">
                        <div class="typing-indicator">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            scrollToBottom();

            // Stream response
            streamResponse(message, typingDiv);
        }

        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const label = sender === 'user' ? '[ YOU ]' : '[ AI SYSTEM ]';
            messageDiv.innerHTML = `
                <div>
                    <div class="message-label">${label}</div>
                    <div class="message-content">${escapeHtml(content)}</div>
                </div>
            `;
            
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function streamResponse(message, typingDiv) {
            const encodedMessage = encodeURIComponent(message);
            const eventSource = new EventSource(`/api/v1/chat/stream?message=${encodedMessage}`);
            
            let fullResponse = '';

            eventSource.onmessage = (event) => {
                fullResponse += event.data;
                
                // Update the message content with accumulated response
                const messageContent = typingDiv.querySelector('.message-content');
                messageContent.innerHTML = escapeHtml(fullResponse);
                scrollToBottom();
            };

            eventSource.onerror = () => {
                eventSource.close();
                
                if (!fullResponse) {
                    typingDiv.querySelector('.message-content').innerHTML = 
                        '<span class="error-message">ERROR: CONNECTION FAILED OR TIMEOUT</span>';
                }
                
                isWaitingForResponse = false;
                sendBtn.disabled = false;
                messageInput.focus();
            };
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
